<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for Irintsoa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #f3e6e6;
    padding: 24px 16px 50px;
  }

  .page {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .intro {
    max-width: 380px;
    text-align: left;
    padding-top: 8px;
  }

  .intro p {
    margin: 6px 0;
    line-height: 1.5;
    font-size: 1.05rem;
  }

  .intro p:first-child {
    font-size: 1.3rem;
    font-weight: 600;
  }

  .puzzle-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .reference {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .reference span {
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #cbb0b6;
  }

  .reference img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  .stage {
    position: relative;
  }

  .board {
    position: absolute;
    top: 0;
    left: 0;
    display: grid;
    background: #fff;
    padding: 6px;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    z-index: 1;
  }

  .slot {
    position: relative;
    background: #f1e7e9;
    border: 1px dashed #d8c4c9;
  }

  .piece {
    position: absolute;
    cursor: grab;
    touch-action: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
  }

  .piece.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
    transform: scale(1.04);
  }

  .win-message {
    margin-top: 20px;
    font-size: 1.2rem;
    font-weight: 600;
    color: #ff9ab3;
    text-align: center;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .win-message.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

  <div class="page">
    <div class="puzzle-wrap">
      <div class="reference">
        <span>how it should look</span>
        <img src="assets/IMG_0298.JPG" alt="reference">
      </div>

      <div id="stage" class="stage">
        <div id="board" class="board"></div>
      </div>

      <div id="winMessage" class="win-message">You did it! 🧩❤️</div>
    </div>

    <div class="intro">
      <p>Hi Irintsoa,</p>
      <p>Been a while, I have been thinking of you lately. though coding you a little puzzle :)) </p>
      <p>From that japan meal :) </p>
    </div>
  </div>

<script>
(function () {
  const IMAGE_SRC = 'assets/IMG_0298.JPG';
  const TARGET_PIECES = 24; // harder, smaller pieces

  const board = document.getElementById('board');
  const stage = document.getElementById('stage');
  const winMessage = document.getElementById('winMessage');

  const img = new Image();
  img.onload = init;
  img.src = IMAGE_SRC;

  function init() {
    const aspect = img.naturalWidth / img.naturalHeight;
    let cols = Math.round(Math.sqrt(TARGET_PIECES * aspect));
    let rows = Math.round(TARGET_PIECES / cols);
    cols = Math.min(Math.max(cols, 3), 8);
    rows = Math.min(Math.max(rows, 3), 8);

    // keep the puzzle itself compact, to the left of the description
    const maxWidth = Math.min(window.innerWidth * 0.34, 300);
    const maxHeight = Math.min(window.innerHeight * 0.4, 300);
    let boardWidth = maxWidth;
    let boardHeight = boardWidth / aspect;
    if (boardHeight > maxHeight) {
      boardHeight = maxHeight;
      boardWidth = boardHeight * aspect;
    }
    const cellW = boardWidth / cols;
    const cellH = boardHeight / rows;
    const tabSize = Math.min(cellW, cellH) * 0.28;

    // pre-render the photo at board resolution so every piece samples the same crisp pixels
    const fullCanvas = document.createElement('canvas');
    fullCanvas.width = boardWidth;
    fullCanvas.height = boardHeight;
    fullCanvas.getContext('2d').drawImage(img, 0, 0, boardWidth, boardHeight);

    board.style.gridTemplateColumns = `repeat(${cols}, ${cellW}px)`;
    board.style.gridTemplateRows = `repeat(${rows}, ${cellH}px)`;
    board.style.gap = '0px';

    // stage is bigger than the board so pieces can be scattered loosely around/over the grid
    const stageWidth = boardWidth + 260;
    const stageHeight = boardHeight + 220;
    stage.style.width = stageWidth + 'px';
    stage.style.height = stageHeight + 'px';

    // random tab per internal border (direction + messy size/neck/offset), shared between the two neighboring pieces
    function randomEdge() {
      return {
        sign: Math.random() < 0.5 ? 1 : -1,
        sizeMul: 0.7 + Math.random() * 0.7,
        neckMul: 0.65 + Math.random() * 0.7,
        offset: (Math.random() - 0.5) * 0.3
      };
    }

    const H = [];
    for (let r = 0; r < rows - 1; r++) {
      H.push(Array.from({ length: cols }, randomEdge));
    }
    const V = [];
    for (let r = 0; r < rows; r++) {
      V.push(Array.from({ length: cols - 1 }, randomEdge));
    }

    function edgeSegment(ctx, x1, y1, x2, y2, edge, flip) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      ctx.save();
      ctx.translate(x1, y1);
      ctx.rotate(angle);
      if (!edge) {
        ctx.lineTo(len, 0);
      } else {
        const sign = flip ? -edge.sign : edge.sign;
        const neck = len * 0.16 * edge.neckMul;
        const mid = len / 2 + edge.offset * len;
        const bump = -tabSize * edge.sizeMul * sign;
        ctx.lineTo(mid - neck, 0);
        ctx.bezierCurveTo(mid - neck, bump * 0.6, mid - neck * 1.7, bump, mid, bump);
        ctx.bezierCurveTo(mid + neck * 1.7, bump, mid + neck, bump * 0.6, mid + neck, 0);
        ctx.lineTo(len, 0);
      }
      ctx.restore();
    }

    function piecePath(ctx, ox, oy, topEdge, topFlip, rightEdge, rightFlip, bottomEdge, bottomFlip, leftEdge, leftFlip) {
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      edgeSegment(ctx, ox, oy, ox + cellW, oy, topEdge, topFlip);
      edgeSegment(ctx, ox + cellW, oy, ox + cellW, oy + cellH, rightEdge, rightFlip);
      edgeSegment(ctx, ox + cellW, oy + cellH, ox, oy + cellH, bottomEdge, bottomFlip);
      edgeSegment(ctx, ox, oy + cellH, ox, oy, leftEdge, leftFlip);
      ctx.closePath();
    }

    const totalPieces = rows * cols;
    const boardSlots = [];

    for (let i = 0; i < totalPieces; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.width = cellW + 'px';
      slot.style.height = cellH + 'px';
      slot.dataset.index = i;
      board.appendChild(slot);
      boardSlots.push(slot);
    }

    const order = Array.from({ length: totalPieces }, (_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }

    const dpr = window.devicePixelRatio || 1;
    const padCanvasW = cellW + tabSize * 2;
    const padCanvasH = cellH + tabSize * 2;
    const maxScatterX = Math.max(stageWidth - padCanvasW, 0);
    const maxScatterY = Math.max(stageHeight - padCanvasH, 0);

    function randomScatterPos() {
      return {
        x: Math.random() * maxScatterX,
        y: Math.random() * maxScatterY
      };
    }

    order.forEach((correctIndex, trayPos) => {
      const r = Math.floor(correctIndex / cols);
      const c = correctIndex % cols;

      const topEdge = r > 0 ? H[r - 1][c] : null;
      const bottomEdge = r < rows - 1 ? H[r][c] : null;
      const leftEdge = c > 0 ? V[r][c - 1] : null;
      const rightEdge = c < cols - 1 ? V[r][c] : null;

      const piece = document.createElement('canvas');
      piece.className = 'piece';
      piece.width = padCanvasW * dpr;
      piece.height = padCanvasH * dpr;
      piece.style.width = padCanvasW + 'px';
      piece.style.height = padCanvasH + 'px';
      piece.dataset.correctIndex = correctIndex;
      piece.style.zIndex = correctIndex + 1;

      const ctx = piece.getContext('2d');
      ctx.scale(dpr, dpr);
      piecePath(ctx, tabSize, tabSize, topEdge, true, rightEdge, false, bottomEdge, false, leftEdge, true);
      ctx.save();
      ctx.clip();
      ctx.drawImage(fullCanvas, tabSize - c * cellW, tabSize - r * cellH);
      ctx.restore();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.stroke();

      const pos = randomScatterPos();
      stage.appendChild(piece);
      piece.style.left = pos.x + 'px';
      piece.style.top = pos.y + 'px';
      attachDrag(piece);
    });

    function attachDrag(piece) {
      let originSlot = null;
      const baseZ = piece.style.zIndex;

      piece.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        originSlot = piece.parentElement;
        piece.classList.add('dragging');
        piece.style.zIndex = 9999;
        piece.setPointerCapture(e.pointerId);
      });

      piece.addEventListener('pointermove', (e) => {
        if (!piece.classList.contains('dragging')) return;
        piece.style.position = 'fixed';
        piece.style.left = (e.clientX - padCanvasW / 2) + 'px';
        piece.style.top = (e.clientY - padCanvasH / 2) + 'px';
      });

      function dropOnSlot(slot) {
        piece.style.position = 'absolute';
        piece.style.left = -tabSize + 'px';
        piece.style.top = -tabSize + 'px';
        piece.style.zIndex = baseZ;
        slot.appendChild(piece);
      }

      function dropOnStage(clientX, clientY) {
        const rect = stage.getBoundingClientRect();
        let x = clientX - rect.left - padCanvasW / 2;
        let y = clientY - rect.top - padCanvasH / 2;
        x = Math.min(Math.max(x, 0), maxScatterX);
        y = Math.min(Math.max(y, 0), maxScatterY);
        piece.style.position = 'absolute';
        piece.style.left = x + 'px';
        piece.style.top = y + 'px';
        piece.style.zIndex = baseZ;
        stage.appendChild(piece);
      }

      function endDrag(e) {
        if (!piece.classList.contains('dragging')) return;
        piece.classList.remove('dragging');

        piece.style.visibility = 'hidden';
        const target = document.elementFromPoint(e.clientX, e.clientY);
        piece.style.visibility = '';

        const targetSlot = target && target.closest('.slot');
        if (!targetSlot || !boardSlots.includes(targetSlot)) {
          dropOnStage(e.clientX, e.clientY);
          return;
        }

        const occupant = targetSlot.firstElementChild;
        dropOnSlot(targetSlot);

        if (occupant) {
          const pos = randomScatterPos();
          occupant.style.position = 'absolute';
          occupant.style.left = pos.x + 'px';
          occupant.style.top = pos.y + 'px';
          stage.appendChild(occupant);
        }

        checkWin();
      }

      piece.addEventListener('pointerup', endDrag);
      piece.addEventListener('pointercancel', endDrag);
    }

    function checkWin() {
      const solved = boardSlots.every((slot) => {
        const piece = slot.firstElementChild;
        return piece && Number(piece.dataset.correctIndex) === Number(slot.dataset.index);
      });
      winMessage.classList.toggle('show', solved);
    }
  }
})();
</script>
</body>
</html>
